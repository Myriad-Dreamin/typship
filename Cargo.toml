[workspace.package]
description = "A simple package manager for Typst"
authors = ["Myriad-Dreamin"]
version = "0.1.0"
rust-version = "1.85.0" # MSRV
edition = "2024"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/Myriad-Dreamin/typship"
repository = "https://github.com/Myriad-Dreamin/typship"

 
[workspace]
resolver = "2"
members = ["crates/*"]

[profile.release]
codegen-units = 1 # Reduce number of codegen units to increase optimizations
opt-level = 3
panic = "abort"   # Abort on panic

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]

# general
anyhow = "1"
## async
# tokio = { version = "1", features = ["full"] }
## sync
# rayon = "1"

# cryptography and processing
## serialization:json
serde_json = "1"
serde = { version = "1", features = ["derive"] }
## serialization:toml
toml = "0.8"
## url utilities: percent-encoding
percent-encoding = "2"
path-clean = "1"
## lexical path cleaning
## (typst packages dir probe, walk over trees, git clone, url parsing)
dirs = "5"
walkdir = "2"
dunce = "1"
url = "2"
## well-known directories
## (typst packages dir, replacing hand-written env probing)

# network (TLS) and compression only, per proposal #119; tar/serde_json/
# percent-encoding/toml all read or write with standard crates
# (admin direction 2026-11-08: no hand-written parsers or encoders)
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"

# cli
palc = "=0.0.2"
## clap = { version = "4.5", features = ["derive", "env", "unicode", "wrap_help"] }
## clap_complete = "4.5"
## clap_complete_fig = "4.5"

# logging and tracing
# env_logger = "0.11"
# log = "0.4.25"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.rust]
missing_docs = "warn"

unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(wasm_bindgen_unstable_test_coverage)',
    'cfg(noop)',
    'cfg(used_linker)',
] }

[workspace.lints.clippy]
uninlined_format_args = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.metadata.typos.default]
locale = "en-us"

[workspace.metadata.typos.default.extend-words]
labelled = "labelled"
onces = "onces"
withs = "withs"

[workspace.metadata.typos.files]
ignore-hidden = false
extend-exclude = ["/.git", "fixtures"]
